services:
  - type: worker
    name: bang-webflow-blog-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_ID
        value: render-blog-worker
      - key: WORKER_BATCH_SIZE
        value: "25"
      - key: WORKER_CONCURRENCY
        value: "25"
      - key: WORKER_STALE_LOCK_MINUTES
        value: "45"
      - key: WORKER_POLL_INTERVAL_MS
        value: "5000"
      - key: WORKER_IDLE_POLL_INTERVAL_MS
        value: "60000"
      - key: WORKER_ERROR_SLEEP_MS
        value: "30000"
      - key: WORKER_HEARTBEAT_MS
        value: "30000"
      - key: KEEP_ALIVE_WHEN_DONE
        value: "true"
      - key: EDGE_REQUEST_TIMEOUT_SECONDS
        value: "90"
      - key: EDGE_MAX_RETRIES
        value: "3"
      - key: OPENAI_REQUEST_TIMEOUT_SECONDS
        value: "900"
      - key: OPENAI_MAX_RETRIES
        value: "3"
      - key: WEBFLOW_REQUEST_TIMEOUT_SECONDS
        value: "120"
      - key: WEBFLOW_MAX_RETRIES
        value: "4"
      - key: STORE_FULL_OPENAI_RESPONSE
        value: "false"
      - key: VALIDATE_WEBFLOW_FIELDS
        value: "true"
      - key: EDGE_FUNCTION_URL
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEBFLOW_API_TOKEN
        sync: false
