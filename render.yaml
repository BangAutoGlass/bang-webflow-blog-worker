services:
  - type: worker
    name: bang-webflow-blog-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WORKER_POLL_INTERVAL_MS
        value: "5000"
      - key: WORKER_STALE_LOCK_MINUTES
        value: "15"
      - key: OPENAI_WEB_SEARCH_TOOL_TYPE
        value: web_search_preview
      - key: BLOG_SERP_PROVIDER
        value: auto
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEBFLOW_API_TOKEN
        sync: false
      - key: best_chatgpt_modal
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: BING_SEARCH_ENDPOINT
        sync: false
